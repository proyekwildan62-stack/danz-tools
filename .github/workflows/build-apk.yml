                          checked -> {
                              if (checked) {
                                  ShizukuShellManager.execAdbAsync("pm trim-caches 4096M && rm -rf /sdcard/Android/data/" + targetPackage + "/cache/*");
                                  Toast.makeText(this, "Cache " + targetPackage + " & sistem dibersihkan!", Toast.LENGTH_SHORT).show();
                              }
                          }
