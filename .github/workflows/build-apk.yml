name: Build DANZ TOOLS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Source Code
        uses: actions/checkout@v4

      - name: 2. Pasang Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Kunci Versi Gradle 8.5 (Wajib Agar Cocok dengan AGP 8.2.2)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Auto-Heal Kode, Spasi Nama File & Header C++
        run: |
          # 1. Bersihkan spasi tak sengaja di ujung nama folder/file hasil ketik di HP
          find . -depth -name "* *" | while IFS= read -r f; do
            clean_name=$(echo "$f" | sed 's/ *$//; s/\/ /\/g; s/ \//\//g')
            if [ "$f" != "$clean_name" ]; then
              mv "$f" "$clean_name" || true
            fi
          done

          # 2. Buat gradle.properties untuk Shizuku AndroidX
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 3. Pastikan gambar logo danz_logo.png valid (Minimal 64x64 PNG jika belum diupload)
          mkdir -p app/src/main/res/drawable
          rm -f app/src/main/res/drawable/*.txt
          if [ -f "danz_logo.png" ]; then
            mv danz_logo.png app/src/main/res/drawable/danz_logo.png
          fi
          if [ ! -f "app/src/main/res/drawable/danz_logo.png" ]; then
            python3 -c '
          import struct, zlib
          def png_chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          w, h = 64, 64
          ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
          raw = b"".join(b"\x00" + (b"\x8a\x2b\xe2\xff" * w) for _ in range(h))
          with open("app/src/main/res/drawable/danz_logo.png", "wb") as f:
              f.write(b"\x89PNG\r\n\x1a\n" + png_chunk(b"IHDR", ihdr) + png_chunk(b"IDAT", zlib.compress(raw)) + png_chunk(b"IEND", b""))
          '
          fi

          # 4. Tambahkan #include <signal.h> otomatis ke native-lib.cpp agar fungsi kill() tidak error di NDK 26
          if [ -f "app/src/main/cpp/native-lib.cpp" ]; then
            if ! grep -q "<signal.h>" app/src/main/cpp/native-lib.cpp; then
              sed -i '1i #include <signal.h>' app/src/main/cpp/native-lib.cpp
            fi
          fi

          # 5. Pastikan ShizukuShellManager menggunakan java.lang.Process standar agar bebas error import
          if [ -f "app/src/main/java/com/sateam/danzinject/ShizukuShellManager.java" ]; then
            sed -i 's/import rikka.shizuku.ShizukuRemoteProcess;//g' app/src/main/java/com/sateam/danzinject/ShizukuShellManager.java
            sed -i 's/ShizukuRemoteProcess proc = (ShizukuRemoteProcess)/Process proc = (Process)/g' app/src/main/java/com/sateam/danzinject/ShizukuShellManager.java
          fi

          # 6. Cek kelengkapan 11 file utama di repo
          echo "=== CEK KELENGKAPAN FILE ==="
          for req in \
            "settings.gradle" \
            "build.gradle" \
            "app/build.gradle" \
            "app/src/main/AndroidManifest.xml" \
            "app/src/main/cpp/CMakeLists.txt" \
            "app/src/main/cpp/native-lib.cpp" \
            "app/src/main/java/com/sateam/danzinject/LicenseManager.java" \
            "app/src/main/java/com/sateam/danzinject/ShizukuShellManager.java" \
            "app/src/main/java/com/sateam/danzinject/AuthActivity.java" \
            "app/src/main/java/com/sateam/danzinject/MainDashboardActivity.java" \
            "app/src/main/java/com/sateam/danzinject/OverlayEngineService.java"; do
            if [ -f "$req" ]; then
              echo "[OK] $req ditemukan"
            else
              echo "[HILANG/SALAH NAMA] $req TIDAK DITEMUKAN!"
            fi
          done

      - name: 5. Pasang Android SDK, NDK 26 & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: 6. Rakit APK Release (DANZ TOOLS)
        run: |
          gradle assembleRelease --no-daemon

      - name: 7. Upload Hasil APK (DANZ-TOOLS-FINAL-APK)
        uses: actions/upload-artifact@v4
        with:
          name: DANZ-TOOLS-FINAL-APK
          path: app/build/outputs/apk/release/*.apk
