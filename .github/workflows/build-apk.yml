name: Build DANZ TOOLS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Source Code
        uses: actions/checkout@v4

      - name: Pasang Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Android SDK
        uses: android-actions/setup-android@v3

      - name: Download NDK C++ & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Siapkan Gradle Engine
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Rakit APK Release (DANZ TOOLS)
        run: |
          gradle assembleRelease --no-daemon

      - name: Siapkan Link Download APK
        uses: actions/upload-artifact@v4
        with:
          name: DANZ-TOOLS-FINAL-APK
          path: app/build/outputs/apk/release/*.apk
