              private LinearLayout buildCrosshairCustomizerBody() {
                  LinearLayout wrap = new LinearLayout(this);
                  wrap.setOrientation(LinearLayout.VERTICAL);
                  wrap.setPadding(0, 16, 0, 8);

                  LinearLayout styleRow = new LinearLayout(this);
                  styleRow.setOrientation(LinearLayout.HORIZONTAL);
                  String[] icons = {"➕", "⊕", "✛", "⌖"};
                  for (int i = 0; i < icons.length; i++) {
                      final int sIdx = i;
                      Button b = makeDarkBtn(icons[i]);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      lp.setMargins(6, 0, 6, 12);
                      b.setLayoutParams(lp);
                      b.setOnClickListener(v -> OverlayEngineService.setCrosshairStyle(sIdx));
                      styleRow.addView(b);
                  }
                  wrap.addView(styleRow);

                  final TextView radarStatusTv = makeLabel("X = 0   Y = 0          Sudut: 80°          Size: 58", 12f, "#00E676", true);
                  radarStatusTv.setGravity(Gravity.CENTER);
                  radarStatusTv.setPadding(16, 20, 16, 20);
                  GradientDrawable radarBg = new GradientDrawable();
                  radarBg.setColor(Color.parseColor("#0A130F"));
                  radarBg.setCornerRadius(20f);
                  radarBg.setStroke(2, Color.parseColor("#00E676"));
                  radarStatusTv.setBackground(radarBg);
                  wrap.addView(radarStatusTv);

                  LinearLayout nudgeRow = new LinearLayout(this);
                  nudgeRow.setOrientation(LinearLayout.HORIZONTAL);
                  nudgeRow.setPadding(0, 12, 0, 12);
                  String[] arrows = {"◀ X-", "▲ Y-", "▼ Y+", "▶ X+"};
                  int[][] deltas = {{-4, 0}, {0, -4}, {0, 4}, {4, 0}};
                  for (int i = 0; i < 4; i++) {
                      final int dx = deltas[i][0];
                      final int dy = deltas[i][1];
                      Button b = makeDarkBtn(arrows[i]);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      lp.setMargins(4, 0, 4, 0);
                      b.setLayoutParams(lp);
                      b.setOnClickListener(v -> {
                          OverlayEngineService.nudgeCrosshairPosition(dx, dy);
                          radarStatusTv.setText("X = " + OverlayEngineService.getCrosshairX() +
                                  "   Y = " + OverlayEngineService.getCrosshairY());
                      });
                      nudgeRow.addView(b);
                  }
                  wrap.addView(nudgeRow);

                  wrap.addView(makeVideoSlider("Rotasi Sudut Bidik (0° - 360°)", 360, 80, "0°", "180°", "360°",
                          deg -> {
                              OverlayEngineService.setCrosshairAngle(deg);
                              radarStatusTv.setText("X = " + OverlayEngineService.getCrosshairX() +
                                      "   Y = " + OverlayEngineService.getCrosshairY() + "   Sudut: " + deg + "°");
                          }));

                  wrap.addView(makeVideoSlider("Ukuran Bidik (Size)", 120, 58, "Kecil", "58", "Besar",
                          OverlayEngineService::setCrosshairSize));

                  wrap.addView(makeVideoSlider("Opacity", 255, 255, "Transparan", "Sedang", "Penuh",
                          OverlayEngineService::setCrosshairAlpha));

                  LinearLayout colorRow = new LinearLayout(this);
                  colorRow.setOrientation(LinearLayout.HORIZONTAL);
                  colorRow.setGravity(Gravity.CENTER);
                  colorRow.setPadding(0, 16, 0, 8);
                  int[] colors = {Color.WHITE, Color.BLACK, Color.RED, Color.parseColor("#FF6D00"), Color.YELLOW, Color.parseColor("#00B0FF")};
                  for (final int c : colors) {
                      View cView = new View(this);
                      GradientDrawable cCircle = new GradientDrawable();
                      cCircle.setShape(GradientDrawable.OVAL);
                      cCircle.setColor(c);
                      cCircle.setStroke(3, Color.parseColor("#2A4739"));
                      cView.setBackground(cCircle);
                      LinearLayout.LayoutParams cLp = new LinearLayout.LayoutParams(76, 76);
                      cLp.setMargins(12, 4, 12, 4);
                      cView.setOnClickListener(v -> OverlayEngineService.setCrosshairColor(c));
                      colorRow.addView(cView, cLp);
                  }
                  wrap.addView(colorRow);

                  return wrap;
              }

              private void showDpiDialog() {
                  final EditText input = new EditText(this);
                  input.setHint("Contoh: 580");
                  new AlertDialog.Builder(this)
                          .setTitle("DPI Smart Costum (Shizuku ADB)")
                          .setMessage("Masukkan nilai DPI untuk Free Fire:")
                          .setView(input)
                          .setPositiveButton("TERAPKAN", (d, w) -> {
                              String val = input.getText().toString().trim();
                              if (!val.isEmpty()) {
                                  playGreenLightningAnimation();
                                  ShizukuShellManager.execAdbAsync("wm density " + val);
                                  Toast.makeText(this, "DPI diatur ke " + val, Toast.LENGTH_SHORT).show();
                              }
                          })
                          .setNegativeButton("BATAL", null)
                          .show();
              }

              private interface ToggleAction {
                  void onToggle(boolean checked);
              }

              private LinearLayout makeExpandableFeatureCard(String title, String badge, String desc, final View expandableBody, final ToggleAction action) {
                  final LinearLayout card = makeVideoCard("#0E1914", "#1B3026");

                  LinearLayout topRow = new LinearLayout(this);
                  topRow.setOrientation(LinearLayout.HORIZONTAL);
                  topRow.setGravity(Gravity.CENTER_VERTICAL);

                  LinearLayout textCol = new LinearLayout(this);
                  textCol.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams textColLp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  textColLp.rightMargin = 16;
                  textCol.setLayoutParams(textColLp);

                  LinearLayout titleBadgeRow = new LinearLayout(this);
                  titleBadgeRow.setOrientation(LinearLayout.HORIZONTAL);
                  titleBadgeRow.setGravity(Gravity.CENTER_VERTICAL);
                  titleBadgeRow.addView(makeLabel(title + "  ", 16f, "#FFFFFF", true));

                  if (badge != null && !badge.isEmpty()) {
                      TextView vipTv = makeLabel(badge, 9f, "#00E676", true);
                      vipTv.setPadding(14, 4, 14, 4);
                      GradientDrawable vipBg = new GradientDrawable();
                      vipBg.setColor(Color.parseColor("#143826"));
                      vipBg.setCornerRadius(12f);
                      vipTv.setBackground(vipBg);
                      titleBadgeRow.addView(vipTv);
                  }
                  textCol.addView(titleBadgeRow);
                  textCol.addView(makeLabel(desc, 11f, "#7C9488", false));
                  topRow.addView(textCol);

                  Switch sw = new Switch(this);
                  topRow.addView(sw);
                  card.addView(topRow);

                  if (expandableBody != null) {
                      expandableBody.setVisibility(View.GONE);
                      card.addView(expandableBody);
                  }

                  sw.setOnCheckedChangeListener((b, isChecked) -> {
                      if (isChecked) {
                          playGreenLightningAnimation();
                      }
                      GradientDrawable bg = new GradientDrawable();
                      bg.setCornerRadius(26f);
                      bg.setColor(Color.parseColor(isChecked ? "#11241B" : "#0E1914"));
                      bg.setStroke(2, Color.parseColor(isChecked ? "#00E676" : "#1B3026"));
                      card.setBackground(bg);

                      if (expandableBody != null) {
                          expandableBody.setVisibility(isChecked ? View.VISIBLE : View.GONE);
                      }
                      action.onToggle(isChecked);
                  });

                  return card;
              }

              private interface SliderListener {
                  void onChanged(int val);
              }

              private LinearLayout makeVideoSlider(String title, int max, int def, String leftLbl, String midLbl, String rightLbl, final SliderListener listener) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(0, 16, 0, 8);

                  box.addView(makeLabel(title, 13f, "#FFFFFF", true));

                  SeekBar sb = new SeekBar(this);
                  sb.setMax(max);
                  sb.setProgress(def);
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          listener.onChanged(progress);
                      }
                      @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                      @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                  });
                  box.addView(sb);

                  LinearLayout lblRow = new LinearLayout(this);
                  lblRow.setOrientation(LinearLayout.HORIZONTAL);
                  TextView l1 = makeLabel(leftLbl, 10f, "#7C9488", false);
                  TextView l2 = makeLabel(midLbl, 10f, "#7C9488", false);
                  l2.setGravity(Gravity.CENTER);
                  TextView l3 = makeLabel(rightLbl, 10f, "#7C9488", false);
                  l3.setGravity(Gravity.END);

                  lblRow.addView(l1, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  lblRow.addView(l2, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  lblRow.addView(l3, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  box.addView(lblRow);

                  return box;
              }

              private CheckBox makeGoPhoneCheck(String text, final String adbCmd) {
