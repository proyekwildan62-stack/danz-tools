                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  tabLp.setMargins(8, 0, 8, 0);
                  bottomPill.addView(navBtnProfile, tabLp);
                  bottomPill.addView(navBtnBolt, tabLp);
                  bottomPill.addView(navBtnTools, tabLp);

                  FrameLayout.LayoutParams navWrapLp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT);
                  navWrapLp.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
                  navWrapLp.bottomMargin = 36;
                  rootFrame.addView(bottomPill, navWrapLp);

                  lightningOverlay = new FrameLayout(this);
                  lightningOverlay.setBackgroundColor(Color.parseColor("#99040806"));
                  lightningOverlay.setVisibility(View.GONE);

                  TextView bigBolt = new TextView(this);
                  bigBolt.setText("⚡");
                  bigBolt.setTextSize(110f);
                  bigBolt.setTextColor(Color.parseColor("#00E676"));
                  bigBolt.setGravity(Gravity.CENTER);
                  FrameLayout.LayoutParams boltLp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.CENTER);
                  lightningOverlay.addView(bigBolt, boltLp);
                  rootFrame.addView(lightningOverlay);

                  setContentView(rootFrame);
              }

              private void switchPage(int idx) {
                  pageProfile.setVisibility(idx == 0 ? View.VISIBLE : View.GONE);
                  pageQuickLaunch.setVisibility(idx == 1 ? View.VISIBLE : View.GONE);
                  pageGameTools.setVisibility(idx == 2 ? View.VISIBLE : View.GONE);

                  if (idx == 0) headerTitleTv.setText("Profile");
                  else if (idx == 1) headerTitleTv.setText("DANZ TOOLS");
                  else headerTitleTv.setText("GameTools");

                  styleNavTab(navBtnProfile, idx == 0);
                  styleNavTab(navBtnBolt, idx == 1);
                  styleNavTab(navBtnTools, idx == 2);
              }

              private Button makeNavTabButton(String text, boolean active) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextSize(13f);
                  b.setPadding(36, 16, 36, 16);
                  styleNavTab(b, active);
                  return b;
              }

              private void styleNavTab(Button b, boolean active) {
                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(40f);
                  if (active) {
                      bg.setColor(Color.parseColor("#183D2B"));
                      b.setTextColor(Color.parseColor("#00E676"));
                      b.setTypeface(Typeface.DEFAULT_BOLD);
                  } else {
                      bg.setColor(Color.TRANSPARENT);
                      b.setTextColor(Color.parseColor("#8CA396"));
                      b.setTypeface(Typeface.DEFAULT);
                  }
                  b.setBackground(bg);
              }

