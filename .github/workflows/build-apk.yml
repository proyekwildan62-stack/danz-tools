              public static class CustomCrosshairView extends View {
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  public int styleIndex = 0;
                  public float angleDeg = 80f;
                  public float sizePx = 58f;
                  public int color = Color.WHITE;
                  public int alpha = 255;

                  public CustomCrosshairView(Context ctx) {
                      super(ctx);
                      paint.setStrokeWidth(4.5f);
                      paint.setStyle(Paint.Style.STROKE);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      paint.setColor(color);
                      paint.setAlpha(alpha);

                      float cx = getWidth() * 0.5f;
                      float cy = getHeight() * 0.5f;
                      float half = sizePx * 0.5f;

                      canvas.save();
                      canvas.rotate(angleDeg, cx, cy);

                      if (styleIndex == 0) {
                          canvas.drawLine(cx - half, cy, cx - 10f, cy, paint);
                          canvas.drawLine(cx + 10f, cy, cx + half, cy, paint);
                          canvas.drawLine(cx, cy - half, cx, cy - 10f, paint);
                          canvas.drawLine(cx, cy + 10f, cx, cy + half, paint);
                          paint.setStyle(Paint.Style.FILL);
                          canvas.drawCircle(cx, cy, 4f, paint);
                          paint.setStyle(Paint.Style.STROKE);
                      } else if (styleIndex == 1) {
                          canvas.drawCircle(cx, cy, half * 0.65f, paint);
                          canvas.drawLine(cx - half, cy, cx + half, cy, paint);
                          canvas.drawLine(cx, cy - half, cx, cy + half, paint);
                      } else if (styleIndex == 2) {
                          canvas.drawLine(cx - half, cy, cx + half, cy, paint);
                          canvas.drawLine(cx, cy - half, cx, cy + half, paint);
                      } else {
                          canvas.drawCircle(cx, cy, half * 0.4f, paint);
                          canvas.drawLine(cx - half, cy, cx - half * 0.4f, cy, paint);
                          canvas.drawLine(cx + half * 0.4f, cy, cx + half, cy, paint);
                          canvas.drawLine(cx, cy - half, cx, cy - half * 0.4f, paint);
                          canvas.drawLine(cx, cy + half * 0.4f, cx, cy + half, paint);
                      }
                      canvas.restore();
                  }
              }

              private void initRogHudOverlay() {
