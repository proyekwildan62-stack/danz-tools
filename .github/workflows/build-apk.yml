name: Build DANZ TOOLS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Repo
        uses: actions/checkout@v4

      - name: 2. Pasang Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Pasang Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Generate Bersih Seluruh Source Code DANZ TOOLS (Zero Indentation Bug)
        run: |
          python3 - << 'PYEOF'
          import os, shutil, struct, zlib, textwrap

          def write_clean(path, content):
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          # Cari file logo danz_logo.png jika sudah pernah diupload di repo
          saved_logo = "/tmp/saved_logo.png"
          if os.path.exists(saved_logo):
              os.remove(saved_logo)
          for root, dirs, files in os.walk("."):
              if ".git" in dirs:
                  dirs.remove(".git")
              if "danz_logo.png" in files:
                  shutil.copy(os.path.join(root, "danz_logo.png"), saved_logo)
                  break

          # Bersihkan folder lama agar tidak ada sisa file yang salah ketik
          for p in ["app", "build.gradle", "settings.gradle", "gradle.properties"]:
              if os.path.isdir(p):
                  shutil.rmtree(p)
              elif os.path.isfile(p):
                  os.remove(p)

          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/java/com/sateam/danzinject", exist_ok=True)

          # Pasang logo atau buat PNG valid 128x128 jika belum ada
          logo_dest = "app/src/main/res/drawable/danz_logo.png"
          if os.path.exists(saved_logo):
              shutil.copy(saved_logo, logo_dest)
          else:
              def chunk(t, d):
                  return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              w, h = 128, 128
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              raw = b"".join(b"\x00" + (b"\x00\xe6\x76\xff" * w) for _ in range(h))
              with open(logo_dest, "wb") as f:
                  f.write(b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b""))

          write_clean("gradle.properties", """
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          """)

          write_clean("settings.gradle", """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DANZ TOOLS"
          include ':app'
          """)

          write_clean("build.gradle", """
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          """)

          write_clean("app/build.gradle", """
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sateam.danzinject'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sateam.danzinject"
                  minSdk 30
                  targetSdk 34
                  versionCode 8
                  versionName "1.0.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "dev.rikka.shizuku:api:13.1.5"
              implementation "dev.rikka.shizuku:provider:13.1.5"
          }
          """)

          write_clean("app/src/main/AndroidManifest.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
                  <package android:name="com.dts.freefireth" />
                  <package android:name="com.dts.freefiremax" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/danz_logo"
                  android:label="DANZ TOOLS"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".AuthActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".MainDashboardActivity"
                      android:exported="false"
                      android:screenOrientation="portrait" />

                  <service
                      android:name=".OverlayEngineService"
                      android:enabled="true"
                      android:exported="false" />

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          """)

          write_clean("app/src/main/java/com/sateam/danzinject/LicenseManager.java", """
          package com.sateam.danzinject;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.provider.Settings;
          import android.util.Base64;

          import org.json.JSONException;
          import org.json.JSONObject;

          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.security.SecureRandom;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Iterator;
          import java.util.Locale;

          import javax.crypto.Mac;
          import javax.crypto.spec.SecretKeySpec;

          public class LicenseManager {
              private static final String PREF_NAME       = "danz_license_vault_v8";
              private static final String KEY_DB_JSON     = "license_records_json";
              private static final String KEY_ACTIVE_CODE = "active_license_key";
              private static final String HMAC_SECRET     = "DANZ_TOOLS_SA_TEAM_SECRET_2026";

              public static final String MASTER_DEV_KEY   = "DANZDEV";

              public enum Tier {
                  DAY_1("1DAY", "1 Day", 1L * 86400000L, "USER"),
                  DAY_3("3DAY", "3 Day", 3L * 86400000L, "USER"),
                  DAY_7("7DAY", "7 Day", 7L * 86400000L, "USER"),
                  DAY_15("15DAY", "15 Day", 15L * 86400000L, "USER"),
                  DAY_30("30DAY", "30 Day", 30L * 86400000L, "USER"),
                  PERMANENT("PERM", "Permanent", 36500L * 86400000L, "VIP_PERM"),
                  RESELLER("RSLR", "Reseller", 3650L * 86400000L, "RESELLER");

                  public final String code;
                  public final String label;
                  public final long durationMs;
                  public final String role;

                  Tier(String code, String label, long durationMs, String role) {
                      this.code = code;
                      this.label = label;
                      this.durationMs = durationMs;
                      this.role = role;
                  }
              }

              public static class ValidationResult {
                  public final boolean valid;
                  public final String message;
                  public final String role;
                  public final String key;
                  public final String hwid;
                  public final long expiresAt;

                  public ValidationResult(boolean valid, String message, String role, String key, String hwid, long expiresAt) {
                      this.valid = valid;
                      this.message = message;
                      this.role = role;
                      this.key = key;
                      this.hwid = hwid;
                      this.expiresAt = expiresAt;
                  }
              }

              private final SharedPreferences prefs;
              private final String deviceHwid;

              public LicenseManager(Context ctx) {
                  this.prefs = ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                  this.deviceHwid = computeDeviceHwid(ctx);
                  ensureMasterKeySeeded();
              }

              public String getDeviceHwid() {
                  return deviceHwid;
              }

              private String computeDeviceHwid(Context ctx) {
                  String androidId = Settings.Secure.getString(ctx.getContentResolver(), Settings.Secure.ANDROID_ID);
                  String raw = (androidId != null ? androidId : "NO_AID") + "|" + Build.BOARD + "|" + Build.BRAND + "|" + Build.HARDWARE;
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] digest = md.digest(raw.getBytes(StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < 4; i++) {
                          sb.append(String.format("%02x", digest[i]));
                      }
                      return sb.toString().toLowerCase(Locale.US);
                  } catch (Exception e) {
                      return "5bffa90c";
                  }
              }

              private void ensureMasterKeySeeded() {
                  JSONObject db = loadDb();
                  if (!db.has(MASTER_DEV_KEY)) {
                      try {
                          JSONObject rec = new JSONObject();
                          rec.put("tier", "DEVELOPER");
                          rec.put("role", "DEVELOPER");
                          rec.put("durationMs", 36500L * 86400000L);
                          rec.put("boundHwid", "");
                          rec.put("activatedAt", 0L);
                          rec.put("expiresAt", System.currentTimeMillis() + (36500L * 86400000L));
                          db.put(MASTER_DEV_KEY, rec);
                          saveDb(db);
                      } catch (JSONException ignored) {}
                  }
              }

              public String generateLicenseKey(Tier tier, String optionalHwid) {
                  SecureRandom rng = new SecureRandom();
                  String chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
                  StringBuilder randPart = new StringBuilder();
                  for (int i = 0; i < 6; i++) {
                      randPart.append(chars.charAt(rng.nextInt(chars.length())));
                  }
                  String sig = signBlock(tier.code + "|" + randPart).substring(0, 4).toUpperCase(Locale.US);
                  String newKey = "DANZ-" + tier.code + "-" + randPart + "-" + sig;

                  JSONObject db = loadDb();
                  try {
                      JSONObject rec = new JSONObject();
                      rec.put("tier", tier.label);
                      rec.put("role", tier.role);
                      rec.put("durationMs", tier.durationMs);
                      rec.put("boundHwid", optionalHwid != null ? optionalHwid.trim().toLowerCase(Locale.US) : "");
                      rec.put("activatedAt", 0L);
                      rec.put("expiresAt", 0L);
                      db.put(newKey, rec);
                      saveDb(db);
                  } catch (JSONException ignored) {}
                  return newKey;
              }

              public ValidationResult validateAndBindKey(String inputKey) {
                  if (inputKey == null || inputKey.trim().isEmpty()) {
                      return new ValidationResult(false, "Key tidak boleh kosong!", "NONE", "", deviceHwid, 0L);
                  }
                  String cleanKey = inputKey.trim().toUpperCase(Locale.US);
                  JSONObject db = loadDb();

                  if (!db.has(cleanKey)) {
                      if (!tryImportSelfSignedKey(cleanKey, db)) {
                          return new ValidationResult(false, "Key tidak valid atau tidak terdaftar!", "NONE", cleanKey, deviceHwid, 0L);
                      }
                  }

                  try {
                      JSONObject rec = db.getJSONObject(cleanKey);
                      String boundHwid = rec.optString("boundHwid", "");
                      long activatedAt = rec.optLong("activatedAt", 0L);
                      long durationMs  = rec.optLong("durationMs", 86400000L);
                      long expiresAt   = rec.optLong("expiresAt", 0L);
                      String role      = rec.optString("role", "USER");

                      if (!boundHwid.isEmpty() && !boundHwid.equalsIgnoreCase(deviceHwid)) {
                          return new ValidationResult(false,
                                  "DITOLAK (1 Key 1 Device)! Key sudah terikat di HWID: " + boundHwid,
                                  role, cleanKey, deviceHwid, expiresAt);
                      }

                      long now = System.currentTimeMillis();
                      if (activatedAt == 0L) {
                          activatedAt = now;
                          expiresAt = now + durationMs;
                          rec.put("activatedAt", activatedAt);
                          rec.put("expiresAt", expiresAt);
                      }

                      if (now > expiresAt) {
                          return new ValidationResult(false,
                                  "Key sudah EXPIRED pada " + formatTimestamp(expiresAt),
                                  role, cleanKey, deviceHwid, expiresAt);
                      }

                      rec.put("boundHwid", deviceHwid);
                      db.put(cleanKey, rec);
                      saveDb(db);
                      prefs.edit().putString(KEY_ACTIVE_CODE, cleanKey).apply();

                      return new ValidationResult(true,
                              "Verified Access (" + role + ")",
                              role, cleanKey, deviceHwid, expiresAt);
                  } catch (JSONException e) {
                      return new ValidationResult(false, "Database error", "NONE", cleanKey, deviceHwid, 0L);
                  }
              }

              private boolean tryImportSelfSignedKey(String key, JSONObject db) {
                  String[] parts = key.split("-");
                  if (parts.length != 4 || !"DANZ".equals(parts[0])) return false;
                  String tierCode = parts[1];
                  String randPart = parts[2];
                  String providedSig = parts[3];

                  String expectedSig = signBlock(tierCode + "|" + randPart).substring(0, 4).toUpperCase(Locale.US);
                  if (!expectedSig.equals(providedSig)) return false;

                  Tier matchedTier = null;
                  for (Tier t : Tier.values()) {
                      if (t.code.equals(tierCode)) {
                          matchedTier = t;
                          break;
                      }
                  }
                  if (matchedTier == null) return false;

                  try {
                      JSONObject rec = new JSONObject();
                      rec.put("tier", matchedTier.label);
                      rec.put("role", matchedTier.role);
                      rec.put("durationMs", matchedTier.durationMs);
                      rec.put("boundHwid", "");
                      rec.put("activatedAt", 0L);
                      rec.put("expiresAt", 0L);
                      db.put(key, rec);
                      saveDb(db);
                      return true;
                  } catch (JSONException e) {
                      return false;
                  }
              }

              public boolean resetHwidForKey(String targetKey) {
                  JSONObject db = loadDb();
                  String clean = targetKey.trim().toUpperCase(Locale.US);
                  if (!db.has(clean)) return false;
                  try {
                      JSONObject rec = db.getJSONObject(clean);
                      rec.put("boundHwid", "");
                      db.put(clean, rec);
                      saveDb(db);
                      return true;
                  } catch (JSONException e) {
                      return false;
                  }
              }

              public String dumpAllKeysSummary() {
                  JSONObject db = loadDb();
                  StringBuilder sb = new StringBuilder();
                  Iterator<String> keys = db.keys();
                  while (keys.hasNext()) {
                      String k = keys.next();
                      JSONObject r = db.optJSONObject(k);
                      if (r != null) {
                          String role = r.optString("role", "USER");
                          String hwid = r.optString("boundHwid", "");
                          sb.append("• ").append(k).append(" [").append(role).append("] ")
                            .append(hwid.isEmpty() ? "(Free)" : "(HWID: " + hwid + ")").append("\n");
                      }
                  }
                  return sb.toString();
              }

              public String getSavedKey() {
                  return prefs.getString(KEY_ACTIVE_CODE, "");
              }

              public static String formatTimestamp(long ms) {
                  if (ms <= 0L) return "-";
                  SimpleDateFormat sdf = new SimpleDateFormat("dd MMMM yyyy", new Locale("id", "ID"));
                  return sdf.format(new Date(ms));
              }

              private String signBlock(String payload) {
                  try {
                      Mac mac = Mac.getInstance("HmacSHA256");
                      mac.init(new SecretKeySpec(HMAC_SECRET.getBytes(StandardCharsets.UTF_8), "HmacSHA256"));
                      byte[] raw = mac.doFinal(payload.getBytes(StandardCharsets.UTF_8));
                      return Base64.encodeToString(raw, Base64.NO_WRAP).replaceAll("[^A-Za-z0-9]", "");
                  } catch (Exception e) {
                      return "9999";
                  }
              }

              private JSONObject loadDb() {
                  try {
                      return new JSONObject(prefs.getString(KEY_DB_JSON, "{}"));
                  } catch (JSONException e) {
                      return new JSONObject();
                  }
              }

              private void saveDb(JSONObject db) {
                  prefs.edit().putString(KEY_DB_JSON, db.toString()).apply();
              }
          }
          """)

          write_clean("app/src/main/java/com/sateam/danzinject/ShizukuShellManager.java", """
          package com.sateam.danzinject;

          import android.content.pm.PackageManager;
          import android.os.Build;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.lang.reflect.Method;
          import java.nio.charset.StandardCharsets;

          import rikka.shizuku.Shizuku;

          public class ShizukuShellManager {
              public static final int SHIZUKU_REQ_CODE = 6767;

              public static boolean isAndroid11OrAbove() {
                  return Build.VERSION.SDK_INT >= Build.VERSION_CODES.R;
              }

              public static boolean isShizukuRunning() {
                  try {
                      return Shizuku.pingBinder();
                  } catch (Throwable t) {
                      return false;
                  }
              }

              public static boolean hasShizukuPermission() {
                  if (!isShizukuRunning()) return false;
                  try {
                      if (Shizuku.isPreV11()) return false;
                      return Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              public static void requestPermission() {
                  try {
                      if (isShizukuRunning() && !hasShizukuPermission()) {
                          Shizuku.requestPermission(SHIZUKU_REQ_CODE);
                      }
                  } catch (Throwable ignored) {}
              }

              public static String execAdbCommand(String command) {
                  StringBuilder output = new StringBuilder();
                  try {
                      if (hasShizukuPermission()) {
                          Method newProcessMethod = Shizuku.class.getDeclaredMethod(
                                  "newProcess", String[].class, String[].class, String.class);
                          newProcessMethod.setAccessible(true);
                          Process proc = (Process) newProcessMethod.invoke(
                                  null, new String[]{"sh"}, null, null);
                          if (proc != null) {
                              OutputStream os = proc.getOutputStream();
                              os.write((command + "\\nexit\\n").getBytes(StandardCharsets.UTF_8));
                              os.flush();
                              os.close();
                              BufferedReader reader = new BufferedReader(new InputStreamReader(proc.getInputStream()));
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  output.append(line).append("\\n");
                              }
                              reader.close();
                              proc.waitFor();
                              proc.destroy();
                              return output.toString().trim();
                          }
                      }
                  } catch (Throwable ignored) {}

                  try {
                      Process p = Runtime.getRuntime().exec(new String[]{"sh", "-c", command});
                      p.waitFor();
                  } catch (Throwable ignored) {}
                  return output.toString().trim();
              }

              public static void execAdbAsync(final String command) {
                  new Thread(() -> execAdbCommand(command)).start();
              }

              public static void applyDragHs(final String pkg, final boolean enable) {
                  execAdbAsync(enable
                      ? "settings put secure view_configuration_touch_slop 2; settings put secure touch_blocking_period 0; setprop debug.touch.drag_hs 1; cmd game mode performance " + pkg
                      : "settings delete secure view_configuration_touch_slop; setprop debug.touch.drag_hs 0");
              }

              public static void applyAimDrag(final boolean enable, final int speedLevel) {
                  int ptrSpeed = Math.min(7, Math.max(1, speedLevel));
                  execAdbAsync(enable
                      ? "settings put system pointer_speed " + ptrSpeed + "; setprop debug.touch.velocity_scale " + ptrSpeed
                      : "settings put system pointer_speed 0; setprop debug.touch.velocity_scale 1");
              }

              public static void applyAimSmooth(final boolean enable, final int smoothLevel) {
                  execAdbAsync(enable
                      ? "setprop debug.sf.early_phase_offset_ns 500000; setprop debug.sf.early_gl_phase_offset_ns 500000; settings put secure long_press_timeout " + (250 + smoothLevel * 2)
                      : "setprop debug.sf.early_phase_offset_ns 0; settings put secure long_press_timeout 400");
              }

              public static void applyControlRecoil(final boolean enable, final int stabilityLevel) {
                  execAdbAsync(enable
                      ? "settings put secure tap_duration_threshold 120; settings put secure ignore_repeat_click_timeout 100; setprop debug.touch.recoil_damp " + stabilityLevel
                      : "settings delete secure tap_duration_threshold; setprop debug.touch.recoil_damp 0");
              }

              public static void applyDanzWarePerformance(final String targetPkg, final boolean enable, final int boostLevel) {
                  new Thread(() -> {
                      if (enable) {
                          String downscale = (boostLevel >= 80) ? "0.85" : (boostLevel >= 50 ? "0.90" : "disabled");
                          StringBuilder cmd = new StringBuilder();
                          cmd.append("cmd game mode performance ").append(targetPkg).append(";\\n");
                          cmd.append("cmd game set --mode 2 --downscale ").append(downscale).append(" --fps 120 ").append(targetPkg).append(";\\n");
                          cmd.append("cmd power set-fixed-performance-mode-enabled true;\\n");
                          cmd.append("cmd thermalservice override-status 0;\\n");
                          cmd.append("setprop debug.sf.latch_unsignaled 1;\\n");
                          cmd.append("setprop debug.sf.disable_backpressure 1;\\n");
                          cmd.append("setprop debug.hwui.renderer skiagl;\\n");
                          cmd.append("setprop debug.egl.hw 1;\\n");
                          cmd.append("setprop debug.performance.tuning 1;\\n");
                          cmd.append("settings put global window_animation_scale 0.0;\\n");
                          cmd.append("settings put global transition_animation_scale 0.0;\\n");
                          cmd.append("settings put global animator_duration_scale 0.0;\\n");
                          cmd.append("cmd package compile -m speed-profile -f ").append(targetPkg).append(";\\n");
                          cmd.append("am kill-all;\\n");
                          cmd.append("pm trim-caches 4096M;\\n");
                          execAdbCommand(cmd.toString());
                      } else {
                          StringBuilder restore = new StringBuilder();
                          restore.append("cmd game mode standard ").append(targetPkg).append(";\\n");
                          restore.append("cmd power set-fixed-performance-mode-enabled false;\\n");
                          restore.append("cmd thermalservice reset;\\n");
                          restore.append("setprop debug.sf.latch_unsignaled 0;\\n");
                          restore.append("setprop debug.sf.disable_backpressure 0;\\n");
                          restore.append("settings put global window_animation_scale 1.0;\\n");
                          restore.append("settings put global transition_animation_scale 1.0;\\n");
                          restore.append("settings put global animator_duration_scale 1.0;\\n");
                          execAdbCommand(restore.toString());
                      }
                  }).start();
              }
          }
          """)

          write_clean("app/src/main/java/com/sateam/danzinject/AuthActivity.java", """
          package com.sateam.danzinject;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import rikka.shizuku.Shizuku;

          public class AuthActivity extends Activity {
              private LicenseManager licenseManager;
              private EditText keyInput;
              private TextView shizukuBadge;

              private final Shizuku.OnRequestPermissionResultListener permListener =
                      (requestCode, grantResult) -> updateShizukuBadge();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  licenseManager = new LicenseManager(this);
                  Shizuku.addRequestPermissionResultListener(permListener);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.parseColor("#070D0A"));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(48, 70, 48, 60);

                  ImageView logoView = new ImageView(this);
                  int resId = getResources().getIdentifier("danz_logo", "drawable", getPackageName());
                  if (resId != 0) logoView.setImageResource(resId);
                  LinearLayout.LayoutParams logoLp = new LinearLayout.LayoutParams(280, 280);
                  logoLp.bottomMargin = 16;
                  root.addView(logoView, logoLp);

                  TextView title = new TextView(this);
