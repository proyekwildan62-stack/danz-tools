name: Build DANZ TOOLS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Source Code
        uses: actions/checkout@v4

      - name: 2. Pasang Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Auto-Fix Struktur Folder, AndroidX & Logo
        run: |
          # Otomatis buat gradle.properties (Wajib untuk library Shizuku Android 11+)
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # Pastikan folder drawable ada & hapus file info.txt / placeholder.txt jika masih tertinggal
          mkdir -p app/src/main/res/drawable
          rm -f app/src/main/res/drawable/*.txt

          # Jika user salah taruh danz_logo.png di luar folder, pindahkan otomatis ke drawable
          if [ -f "danz_logo.png" ]; then
            mv danz_logo.png app/src/main/res/drawable/danz_logo.png
          fi

          # Jika danz_logo.png belum terupload, buat icon cadangan otomatis agar build tidak gagal
          if [ ! -f "app/src/main/res/drawable/danz_logo.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkWPjfDwAEgQH53528KAAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/drawable/danz_logo.png
          fi

          # Tampilkan daftar file yang sudah kamu buat di repo untuk pengecekan
          echo "=== DAFTAR FILE DI REPO KAMU ==="
          find . -maxdepth 6 -not -path '*/.*'

      - name: 4. Pasang Android NDK & CMake Bawaan Server
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: 5. Rakit APK Release (DANZ TOOLS)
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: 6. Upload Hasil APK (DANZ_TOOLS.apk)
        uses: actions/upload-artifact@v4
        with:
          name: DANZ-TOOLS-FINAL-APK
          path: app/build/outputs/apk/release/*.apk
