                      private int ix, iy;
                      private float tx, ty;
                      @Override
                      public boolean onTouch(View v, MotionEvent ev) {
                          switch (ev.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  ix = rogParams.x; iy = rogParams.y;
                                  tx = ev.getRawX(); ty = ev.getRawY();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  rogParams.x = ix + (int) (ev.getRawX() - tx);
                                  rogParams.y = iy + (int) (ev.getRawY() - ty);
                                  wm.updateViewLayout(rogBarContainer, rogParams);
                                  return true;
                          }
                          return false;
                      }
                  });

                  rogBarContainer.setVisibility(View.GONE);
                  wm.addView(rogBarContainer, rogParams);
              }

              private void startFpsAndRogLoop() {
                  Choreographer.getInstance().postFrameCallback(new Choreographer.FrameCallback() {
                      @Override
                      public void doFrame(long frameTimeNanos) {
                          frameCount++;
                          if (frameTimeNanos - lastSecondNs >= 1_000_000_000L) {
                              currentFps = frameCount;
                              frameCount = 0;
                              lastSecondNs = frameTimeNanos;
                          }
                          if (instance != null) {
                              Choreographer.getInstance().postFrameCallback(this);
                          }
                      }
                  });

                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          refreshRogText();
                          if (instance != null) {
                              handler.postDelayed(this, 1000L);
                          }
                      }
                  }, 1000L);
              }

              private void refreshRogText() {
                  if (rogTextView == null) return;
                  ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                  ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                  am.getMemoryInfo(mi);
                  int ramPct = (int) (((mi.totalMem - mi.availMem) * 100L) / mi.totalMem);

                  Intent batt = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                  int battPct = 100;
                  int tempC = 37;
                  if (batt != null) {
                      int l = batt.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                      int s = batt.getIntExtra(BatteryManager.EXTRA_SCALE, -1);
                      if (l >= 0 && s > 0) battPct = (l * 100) / s;
                      tempC = batt.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 370) / 10;
                  }

                  int cpuSim = 24 + (currentFps % 15);
                  StringBuilder sb = new StringBuilder("🦅 ");
                  if (rogFlags[0]) sb.append("🔥 ").append(cpuSim).append("%  ");
                  if (rogFlags[1]) sb.append("💾 ").append(ramPct).append("%  ");
                  if (rogFlags[2]) sb.append("🌡️ ").append(tempC).append("°C  ");
                  if (rogFlags[3]) sb.append("🔋 ").append(battPct).append("%  ");
                  if (rogFlags[4]) sb.append("🎮 ").append(currentFps).append("  ");
                  if (rogFlags[5]) {
                      sb.append("🕒 ").append(new SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(new Date()));
                  }
                  rogTextView.setText(sb.toString().trim());
              }

