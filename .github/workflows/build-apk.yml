              private LinearLayout makeSysTile(String title, String bigRight, String subBottom, int progress) {
                  LinearLayout tile = new LinearLayout(this);
                  tile.setOrientation(LinearLayout.VERTICAL);
                  tile.setPadding(20, 20, 20, 20);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#13221B"));
                  bg.setCornerRadius(20f);
                  tile.setBackground(bg);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  lp.setMargins(8, 8, 8, 8);
                  tile.setLayoutParams(lp);

                  TextView topVal = makeLabel(bigRight, 16f, "#00E676", true);
                  topVal.setGravity(Gravity.END);
                  tile.addView(topVal);

                  tile.addView(makeLabel(title, 12f, "#FFFFFF", true));

                  ProgressBar pb = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  pb.setMax(100);
                  pb.setProgress(progress);
                  tile.addView(pb);

                  tile.addView(makeLabel(subBottom, 10f, "#7C9488", false));
                  return tile;
              }

